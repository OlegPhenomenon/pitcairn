[package]
name = "pitcairn"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
sqlx = { version = "0.8", features = ["sqlite", "migrate", "macros", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
totp-rs = { version = "5", features = ["qr", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
ts-rs = "10"
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
anyhow = "1"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "cookies"] }
tempfile = "3"
sha2 = "0.10"
hex = "0.4"

# Keep target/ small: no debug info for dependencies, line tables only for our crate.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
